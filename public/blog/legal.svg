<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212121"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.24" r="0.72">
      <stop offset="0" stop-color="#e30613" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e30613" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="800" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="500" fill="url(#base)"/>
    <rect width="800" height="500" fill="url(#glow)"/>
    <rect width="800" height="500" fill="url(#dots)"/>

    <!-- a document, with the line that matters picked out -->
    <g stroke="#ffffff" stroke-opacity="0.14" stroke-width="7" stroke-linecap="round">
      <path d="M190 118h430"/>
      <path d="M190 170h430"/>
      <path d="M190 274h430"/>
      <path d="M190 326h430"/>
      <path d="M190 378h260"/>
    </g>
    <path d="M190 222h340" stroke="#e30613" stroke-width="7" stroke-linecap="round"/>
    <rect x="148" y="200" width="5" height="44" fill="#e30613"/>

    <!-- step markers down the left edge -->
    <g fill="#ffffff" fill-opacity="0.16">
      <rect x="60" y="118" width="26" height="3"/>
      <rect x="60" y="222" width="26" height="3" fill="#e30613" fill-opacity="0.8"/>
      <rect x="60" y="326" width="26" height="3"/>
    </g>

    <!-- cover word -->
    <text x="205" y="470" font-family="Impact, 'Arial Black', 'Haettenschweiler', sans-serif"
          font-size="150" letter-spacing="-2" fill="none"
          stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.5">PROCESS</text>
  </g>
</svg>
