<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212121"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#e30613" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#e30613" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="800" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="500" fill="url(#base)"/>
    <rect width="800" height="500" fill="url(#glow)"/>
    <rect width="800" height="500" fill="url(#dots)"/>

    <!-- five points, connected — one becomes many -->
    <g stroke="#e30613" stroke-opacity="0.4" stroke-width="2">
      <path d="M200 150 L400 235 L600 140"/>
      <path d="M200 150 L285 350 L400 235"/>
      <path d="M400 235 L545 355 L600 140"/>
      <path d="M285 350 L545 355"/>
      <path d="M110 265 L200 150"/>
      <path d="M690 280 L600 140"/>
    </g>
    <g fill="none" stroke="#e30613" stroke-opacity="0.22" stroke-width="2">
      <circle cx="400" cy="235" r="46"/>
      <circle cx="400" cy="235" r="92"/>
    </g>
    <g fill="#e30613">
      <circle cx="400" cy="235" r="16"/>
      <circle cx="200" cy="150" r="10" fill-opacity="0.8"/>
      <circle cx="600" cy="140" r="10" fill-opacity="0.8"/>
      <circle cx="285" cy="350" r="10" fill-opacity="0.8"/>
      <circle cx="545" cy="355" r="10" fill-opacity="0.8"/>
      <circle cx="110" cy="265" r="7" fill-opacity="0.5"/>
      <circle cx="690" cy="280" r="7" fill-opacity="0.5"/>
    </g>

    <!-- cover word -->
    <text x="150" y="478" font-family="Impact, 'Arial Black', 'Haettenschweiler', sans-serif"
          font-size="140" letter-spacing="-2" fill="none"
          stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.5">TOGETHER</text>
  </g>
</svg>
