<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#212121"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.5" r="0.72">
      <stop offset="0" stop-color="#e30613" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e30613" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="frame"><rect width="800" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="800" height="500" fill="url(#base)"/>
    <rect width="800" height="500" fill="url(#glow)"/>
    <rect width="800" height="500" fill="url(#dots)"/>

    <!-- a voice carrying outward -->
    <g fill="none" stroke="#e30613">
      <circle cx="250" cy="250" r="54" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="250" cy="250" r="108" stroke-opacity="0.45" stroke-width="2"/>
      <circle cx="250" cy="250" r="168" stroke-opacity="0.28" stroke-width="2"/>
      <circle cx="250" cy="250" r="236" stroke-opacity="0.14" stroke-width="2"/>
      <circle cx="250" cy="250" r="310" stroke-opacity="0.07" stroke-width="2"/>
    </g>
    <circle cx="250" cy="250" r="13" fill="#e30613"/>

    <!-- cover word -->
    <text x="470" y="392" font-family="Impact, 'Arial Black', 'Haettenschweiler', sans-serif"
          font-size="150" letter-spacing="-2" fill="none"
          stroke="#ffffff" stroke-opacity="0.11" stroke-width="1.5">SILENCE</text>
  </g>
</svg>
